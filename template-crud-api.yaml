---
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: aws-sam-python-crud
  title: AWS Serverless CRUD API (Python)
  description: |
    Create a Python AWS serverless CRUD backend API.

    This template provides the following for the newly created Component

    * AWS API Gateway
    * Lambda functions for CRUD operations
      * With starter code
      * With starter tests
      * With starter mock data and schemas
    * A DynamoDB table
    * GitHub Actions build and deploy workflows
    * Starter OpenAPI spec file

  tags:
    - aws
    - serverless
    - python
    - api

spec:
  owner: group:00gjdgxs1ur6lsu
  type: component

  parameters:
    - title: Component Info
      required:
        - lifecycle
        - namespace
        - github_org
        - component_name
        - description
        - owner
        - system
        - domain
        - environment
        - account_id
      properties:
        lifecycle:
          title: Lifecycle
          type: string
          description: Lifecycle for the component
          default: production
          ui:widget: hidden
        namespace:
          title: Namespace
          type: string
          description: Namespace for the component
          default: default
          ui:widget: hidden
        github_org:
          title: GitHub Org
          type: string
          description: GitHub organization to publish to
          default: ServerlessOpsIO
          ui:widget: hidden
        component_name:
          title: Name
          type: string
          description: Unique name of the component
          ui:field: EntityNamePicker
        description:
          title: Description
          type: string
          description: Short description of the component
        owner:
          title: Owner
          type: string
          description: |
            Owning group of entity.
          ui:field: MyGroupsPicker
          ui:options:
            allowArbitraryValues: false
        domain:
          title: Domain
          type: string
          description: Domain the component belongs to.
          ui:field: SoContextualEntityPicker
          ui:options:
            allowArbitraryValues: false
            catalogFilter:
              - kind: Domain
            defaultKind: Domain
        system:
          title: System
          type: string
          description: System the component belongs to.
          ui:field: SoContextualEntityPicker
          ui:options:
            allowArbitraryValues: false
            catalogFilter:
              - kind: System
                relations.partOf: "{{ parameters.domain }}"
            defaultKind: System
        environment:
          title: Environment
          type: string
          description: Environment the component belongs to.
          ui:field: SoContextualEntityPicker
          ui:options:
            allowArbitraryValues: false
            catalogFilter:
              - kind: Resource
                relations.partOf: "{{ parameters.system }}"
                spec.type: environment
        account_id:
          title: Account ID
          type: string
          description: Cloud account to deploy to
          ui:field: SoContextualEntityPicker
          ui:options:
            allowArbitraryValues: false
            catalogFilter:
              - kind: Resource
                relations.dependencyOf: "{{ parameters.environment }}"
                spec.type: cloud-account

    - title: Software configuration
      required:
        - hostname
        - collection_name
        - api_description
        - python_version
      properties:
        hostname:
          title: Hostname
          type: string
          description: Site FQDN;  ex. api.app.serverlessops.io
        url_path_prefix:
          title: Path Prefix (without collection name)
          type: string
          description: Path prefix for API; ex. /v1
          default: '/v1'
        collection_name:
          title: Collection Name
          type: string
          description: Name of API collection; eg. <path_prefix>/<collection_name> -> /v1/thing
        api_description:
          title: API Description
          type: string
          description: Description of the API
          'ui:widget': 'textarea'
        python_version:
          title: Python Version
          type: string
          description: Python version to use
          default: '3.14'
          enum:
            - '3.13'
            - '3.14'

    - title: Copilot Cloud Agent
      required: []
      properties:
        launch_copilot_agent:
          title: "Launch Copilot agent?"
          type: boolean
          description: Launch a Copilot cloud agent after component creation
          default: false
      dependencies:
        launch_copilot_agent:
          oneOf:
            - properties:
                launch_copilot_agent:
                  const: false
            - required:
                - github_auth
              properties:
                launch_copilot_agent:
                  const: true
                initialize_speckit:
                  title: "Initialize Spec Kit?"
                  type: boolean
                  description: Initialize Spec Kit in the generated project workspace
                  default: false
                github_auth:
                  type: string
                  ui:field: SoRequestUserCredentials
                  ui:options:
                    host: github.com
                    requestUserCredentials:
                      secretsKey: USER_GITHUB_TOKEN
                      additionalScopes:
                        github:
                          - read:user
              dependencies:
                initialize_speckit:
                  oneOf:
                    - required:
                        - agent_prompt
                      properties:
                        initialize_speckit:
                          const: false
                        agent_prompt:
                          title: Agent prompt
                          type: string
                          description: Initial prompt to send to the Copilot cloud agent
                          minLength: 1
                          ui:widget: textarea
                    - required:
                        - speckit_constitution
                      properties:
                        initialize_speckit:
                          const: true
                        speckit_constitution:
                          title: Spec Kit constitution
                          type: string
                          description: Describe the project and principles for its Spec Kit constitution
                          minLength: 1
                          ui:widget: textarea
                          default: "This is an AWS serverless REST API written in Python. It uses AWS API Gateway as the API interface, AWS Lambda functions for compute, and DynamoDB as it's Datastore..."

  steps:
    - id: fetch
      name: Fetch Entity References
      action: catalog:fetch
      input:
        entityRefs:
          - ${{ parameters.owner }}
          - ${{ parameters.domain }}
          - ${{ parameters.system }}
          - ${{ parameters.account_id }}

    - id: create-skeleton
      name: Create project skeleton
      action: fetch:template
      input:
        url: ./skeleton/base
        values:
          domain_name: ${{ parameters.domain | parseEntityRef | pick('name') }}
          system_name: ${{ parameters.system | parseEntityRef | pick('name') }}
          component_name: ${{ parameters.component_name }}
          owner_name: ${{ parameters.system | parseEntityRef | pick('name') }}
          description: ${{ parameters.description }}
          api_description: ${{ parameters.api_description }}
          hostname: ${{ parameters.hostname }}
          collection_name: ${{ parameters.collection_name }}
          collection_name_cap: ${{ parameters.collection_name | capitalize }}
          github_org: ${{ parameters.github_org }}
          lifecycle: ${{ parameters.lifecycle }}
          python_version: ${{ parameters.python_version }}
          is_crud: true

    - id: add-crud-skeleton
      name: Add API project skeleton
      action: fetch:template
      input:
        url: ./skeleton/crud
        values:
          domain_name: ${{ parameters.domain | parseEntityRef | pick('name') }}
          system_name: ${{ parameters.system | parseEntityRef | pick('name') }}
          component_name: ${{ parameters.component_name }}
          owner_name: ${{ parameters.system | parseEntityRef | pick('name') }}
          description: ${{ parameters.description }}
          api_description: ${{ parameters.api_description }}
          hostname: ${{ parameters.hostname }}
          collection_name: ${{ parameters.collection_name }}
          collection_name_cap: ${{ parameters.collection_name | capitalize }}
          url_path_prefix: ${{ parameters.url_path_prefix }}
          python_version: ${{ parameters.python_version }}

    - id: create-functions
      name: Create project functions
      action: fetch:template
      input:
        url: ./functions/crud
        values:
          domain_name: ${{ parameters.domain | parseEntityRef | pick('name') }}
          system_name: ${{ parameters.system | parseEntityRef | pick('name') }}
          component_name: ${{ parameters.component_name }}
          description: ${{ parameters.description }}
          collection_name: ${{ parameters.collection_name }}
          collection_name_cap: ${{ parameters.collection_name | capitalize }}
          url_path_prefix: ${{ parameters.url_path_prefix }}

    - id: cluster-pipeline
      name: Create CI/CD pipeline
      action: fetch:template
      input:
        url: ./pipeline
        values:
          python_version: ${{ parameters.python_version }}

    - id: initialize-speckit
      if: ${{ parameters.launch_copilot_agent and parameters.initialize_speckit }}
      name: Initialize Spec Kit
      action: github:copilot:speckit:init

    - id: publish
      name: Publish to GitHub
      action: publish:github
      input:
        repoUrl: github.com?repo=${{ parameters.component_name }}&owner=${{ parameters.github_org }}
        repoVisibility: public
        protectDefaultBranch: false
        requiredApprovingReviewCount: 0
        description: ${{ parameters.description }}
        gitAuthorName: ${{ user.entity.spec.profile.displayName }}
        gitAuthorEmail:  ${{ user.entity.spec.profile.email }}
        gitCommitMessage: "Initial commit via Backstage"
        defaultBranch: main
        secrets:
          DEPLOYMENT_ACCOUNT_ID: ${{ steps.fetch.output.entities[3].metadata.title }}
        customProperties:
          system: ${{ parameters.system | parseEntityRef | pick('name') }}
          domain: ${{ parameters.domain | parseEntityRef | pick('name') }}
          owner: ${{ parameters.owner | parseEntityRef | pick('name') }}

    - id: register
      name: Register in Backstage
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: "/catalog-info.yaml"

    - id: launch-copilot-agent
      name: Launch Copilot agent
      if: ${{ parameters.launch_copilot_agent and not parameters.initialize_speckit }}
      action: github:copilot:agent:launch
      input:
        repoUrl: github.com?repo=${{ parameters.component_name }}&owner=${{ parameters.github_org }}
        prompt: ${{ parameters.agent_prompt }}
        userCredentialsSecretKey: USER_GITHUB_TOKEN
      secrets:
        USER_GITHUB_TOKEN: ${{ secrets.USER_GITHUB_TOKEN }}

    - id: create-speckit-constitution
      name: Create Spec Kit constitution
      if: ${{ parameters.launch_copilot_agent and parameters.initialize_speckit }}
      action: github:copilot:speckit:constitution
      input:
        repoUrl: github.com?repo=${{ parameters.component_name }}&owner=${{ parameters.github_org }}
        prompt: ${{ parameters.speckit_constitution }}
        userCredentialsSecretKey: USER_GITHUB_TOKEN
      secrets:
        USER_GITHUB_TOKEN: ${{ secrets.USER_GITHUB_TOKEN }}


  output:
    links:
      - title: New repository
        url: ${{ steps.publish.output.remoteUrl }}
      - title: Repository catalog-info.yaml file
        url: ${{ steps.publish.output.remoteUrl }}/blob/main/catalog-info.yaml
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}
      - title: Launched agent task
        url: ${{ steps['launch-copilot-agent'].output.taskUrl if parameters.launch_copilot_agent and not parameters.initialize_speckit else nil }}
      - title: Spec Kit constitution task
        url: ${{ steps['create-speckit-constitution'].output.taskUrl if parameters.launch_copilot_agent and parameters.initialize_speckit else nil }}
